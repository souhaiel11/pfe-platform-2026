networks:
  pfe-network:
    external: true
    name: pfe-network

volumes:
  postgres_data:

services:
  postgres:
    image: postgres:16-alpine
    container_name: pfe-postgres
    environment:
      POSTGRES_DB: devsecops
      POSTGRES_USER: devsecops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - pfe-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devsecops"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    container_name: pfe-backend
    hostname: backend
    ports:
      - "3001:3001"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: devsecops
      DB_PASS: ${POSTGRES_PASSWORD}
      DB_NAME: devsecops
      JWT_SECRET: ${JWT_SECRET}
      N8N_URL: http://n8n:5678
      AZURE_DEPLOY_AGENT_URL: http://172.19.0.1:7799
    networks:
      pfe-network:
        aliases:
          - backend
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    container_name: pfe-frontend
    ports:
      - "4200:80"
    volumes:
      - ./frontend/dist/devsecops-frontend/browser:/usr/share/nginx/html
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - pfe-network
    depends_on:
      - backend
