# Sert le frontend et transmet les appels API au backend.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Résout à nouveau le nom du backend après le remplacement du conteneur.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream backend:3001;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Revalide index.html pour charger les bons fichiers après une livraison.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # main.js, polyfills.js et styles.css gardent le même nom d'une livraison à l'autre : sans
    # revalidation, le navigateur exécute l'ancienne interface après une mise à jour.
    location ~ ^/(main|polyfills)\.js$ {
        add_header Cache-Control "no-cache";
    }
    location = /styles.css {
        add_header Cache-Control "no-cache";
    }

    location /api {
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # L'agent d'optimisation Jenkinsfile (LLM) peut prendre 1-2 min —
        # le défaut nginx (60s) coupait avant le timeout backend (180s).
        proxy_read_timeout 200s;
        proxy_send_timeout 200s;
    }

    location /socket.io {
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
    }
}
