server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html référence les chunks JS/CSS par nom haché (cache-bust
    # automatique à chaque build) — mais index.html lui-même n'a pas de
    # nom haché, donc SANS ceci un navigateur qui le met en cache
    # heuristique continue de charger un vieux bundle après un déploiement,
    # même après F5. no-cache force la revalidation à chaque requête (pas
    # de contenu obsolète), sans empêcher le cache long des chunks hachés.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /api {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # L'agent d'optimisation Jenkinsfile (LLM) peut prendre 1-2 min —
        # le défaut nginx (60s) coupait avant le timeout backend (180s).
        proxy_read_timeout 200s;
        proxy_send_timeout 200s;
    }

    location /socket.io {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
    }
}
